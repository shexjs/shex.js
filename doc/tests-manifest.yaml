# Every example in this repository, as one manifest.
#
# GENERATED by tools/aggregate-manifests.js from the three manifests below;
# edit those and run it again.  The entries are theirs, with the documents
# they name moved to where this file can find them.
#
# Open it in the validator:
#   packages/shex-webapp/doc/shex-simple.html?manifestURL=../../../doc/tests-manifest.yaml
# ...where picking an entry loads whatever plugin that entry needs, so the
# suite ends with the plugins loaded that its last entries asked for.

# --- packages/shex-webapp/examples/manifest.yaml
# the validator's own examples
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: the least an Observation can be
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1> :subject <Patient2> .
  queryMap: |
    <Obs1>@START
  status: conformant
  comment: 'Everything in <ObservationShape> is optional but :subject, so this is the whole of a conforming Observation.  Each example below adds one thing to it.'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: with birthdate
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1>
      :status    "final" ;
      :subject   <Patient2> .
    
    <Patient2>
      :name "Bob" ;
      :birthdate "1999-12-31"^^xsd:date .
  queryMap: |
    {FOCUS :status _}@START,
    <Patient2>@!<ObservationShape>
  status: conformant
  comment: 'The query map is core ShapeMap: every node with a :status, and a claim that the patient is *not* an Observation.'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a whole measurement
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    PREFIX loinc: <http://loinc.org/rdf#>
    
    <Obs1>
      :status            "final" ;
      :code              loinc:29463-7 ;        # Body weight
      :effectiveDateTime "2026-08-13T09:41:00Z"^^xsd:dateTime ;
      :performer         <Practitioner7> ;
      :subject           <Patient2> ;
      :valueQuantity     [
        :value  81.2 ;
        :unit   "kg" ;
        :system <http://unitsofmeasure.org> ;
        :code   "kg"
      ] .
    
    <Practitioner7> :name "Dr. Alice Chen" .
    
    <Patient2>
      :active     true ;
      :name       "Bob" , "Robert Smith" ;
      :gender     "male" ;
      :birthdate  "1999-12-31"^^xsd:date ;
      :identifier [
        :system <http://hospital.example/mrn> ;
        :value  "MRN-40281"
      ] .
  queryMap: |
    <Obs1>@START
  status: conformant
  comment: 'Every element the schema knows, in one document.'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: the same measurement, in two documents
  dataURL:
  - ../packages/shex-webapp/examples/ClinObs-observation.ttl
  - ../packages/shex-webapp/examples/ClinObs-patient.ttl
  queryMap: |
    <http://hl7.example/Obs1>@<ObservationShape>
  status: conformant
  comment: 'A graph is not a file: the observation comes from an instrument, the patient from a registry, and they meet at the IRI one names and the other describes.  The tabs are named after what each document says it is, and hovering a constraint whose match is in the other document brings that document forward to highlight it.'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: no subject
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1> :status "final" .
  queryMap: |
    <Obs1>@START
  status: nonconformant
  comment: 'The one thing an Observation must have.'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a status outside the value set
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1>
      :status    "finally" ;
      :subject   <Patient2> .
  queryMap: |
    <Obs1>@START
  status: nonconformant
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a birthdate that is a dateTime
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1> :subject <Patient2> .
    
    <Patient2> :birthdate "1999-12-31T01:23:45"^^xsd:dateTime .
  queryMap: |
    <Obs1>@START
  status: nonconformant
  comment: 'A date and a dateTime are different datatypes, however alike they read.'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a quantity with no number and no code
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1>
      :subject       <Patient2> ;
      :valueQuantity [
        :unit "kg" ;
        :system <http://unitsofmeasure.org> ;
      ] .
  queryMap: |
    <Obs1>@START
  status: nonconformant
  comment: 'Quantity :value is required and :system is contingent on :code'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a gender outside the value set
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1> :subject <Patient2> .
    
    <Patient2> :gender "M" .
  queryMap: |
    <Obs1>@START
  status: nonconformant
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: two documents, and the mistake is in the second
  data:
  - |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    BASE <http://hl7.example/>
    
    # Observation
    <Obs1>
      :status  "final" ;
      :subject <Patient2> .
  - |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    BASE <http://hl7.example/>
    
    # Patient
    <Patient2>
      :name   "Bob" ;
      :gender "M" .
  queryMap: |
    <http://hl7.example/Obs1>@<ObservationShape>
  status: nonconformant
  comment: 'Validating the observation walks into the patient, so a bad gender code in the second document fails the first.  Hovering the failure switches to the document that caused it.'
- schemaLabel: GO-CAM example
  schemaURL: ../packages/shex-webapp/examples/GO-CAM-schema.shex
  dataLabel: 1 instance with parents
  dataURL: ../packages/shex-webapp/examples/GO-CAM-instance.ttl
  queryMap: |
    <http://model.geneontology.org/5b528b1100001416/5b528b1100001522>@<#S1>
  status: conformant
- schemaLabel: wikidata query
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX prov: <http://www.w3.org/ns/prov#>
    PREFIX p: <http://www.wikidata.org/prop/>
    PREFIX pr: <http://www.wikidata.org/prop/reference/>
    PREFIX ps: <http://www.wikidata.org/prop/statement/>

    start = @<wikidata_item>

    <wikidata_item> {
      p:P1748 {
        ps:P1748 LITERAL ;
        prov:wasDerivedFrom @<reference>+
      }+
    }

    <reference> {
      pr:P248  IRI ;
      pr:P813  xsd:dateTime ;
      # pr:P699  LITERAL
    }
  dataLabel: '12078'
  queryMap: |-
    SPARQL '''SELECT ?item ?itemLabel WHERE {
      ?item wdt:P279* wd:Q12078 .
      SERVICE wikibase:label {
        bd:serviceParam wikibase:language "en"
      }
    } LIMIT 10'''@START
  status: conformant
  neighborhood: sparql
  endpoint: https://query.wikidata.org/sparql
- schemaLabel: Wikidata person
  schemaURL: ../packages/shex-webapp/examples/wikidata-person.shex
  dataLabel: Q42 from the query service
  neighborhood: sparql
  endpoint: https://query.wikidata.org/sparql
  queryMap: |
    <http://www.wikidata.org/entity/Q42>@START
  status: conformant
  comment: Douglas Adams, validated by asking query.wikidata.org for each neighborhood as the walk needs it.
- schemaLabel: Wikidata person
  schemaURL: ../packages/shex-webapp/examples/wikidata-person.shex
  dataLabel: Q42 from the JSON API
  neighborhood: wikidata
  base: https://www.wikidata.org/wiki/Special:EntityData/
  queryMap: |
    QENTITIES "42 76"@START
  status: conformant
  comment: The same entity from the JSON pages Wikidata is edited through, turned back into the RDF the query service would serve.  The QueryMap names entities by id and lets this source work out what they are called.
  data: |
    Q42
- schemaLabel: Wikidata person
  schemaURL: ../packages/shex-webapp/examples/wikidata-person.shex
  dataLabel: Q42 from a downloaded page
  neighborhood: wikidata
  dataURL: ../packages/shex-webapp/examples/wikidata-Q42.json
  queryMap: |
    <http://www.wikidata.org/entity/Q42>@START
  status: conformant
  comment: 'The same entity from a page downloaded earlier: edit it in the pane to see what an edit would validate as before making it.  With a downloaded site table too (the sitelinks in a page name wikis like "enwiki", and only that table says which URL and language that is), this entry needs no network at all.'
  sitematrix: ../packages/shex-webapp/examples/wikidata-sitematrix.json
- schemaLabel: Wikidata human gene
  schemaURL: ../packages/shex-webapp/examples/wikidata-human-gene.shex
  dataLabel: BRCA1, its chromosome and its assembly
  neighborhood: wikidata
  base: https://www.wikidata.org/wiki/Special:EntityData/
  queryMap: |
    QENTITIES "227339"@START
  status: conformant
  comment: 'GeneWiki''s human gene schema (EntitySchema:E37), with the two schemas it imports inlined: a gene''s chromosome is E109''s and the genome assembly its coordinates are given against is E108''s.  So validating BRCA1 (Q227339) walks from the gene to chromosome 17 (Q220677) and on to GRCh38 (Q20966585) -- three entities, three shapes, each page fetched as the walk reaches it.  Four constraints are relaxed here, each marked RELAXED IN THIS COPY where it stands: three are places where the data cites a source the schema enumerates without (a newer Ensembl release, the OMA browser), and one is a normalized value this source can''t derive from an entity page.'
  data: |
    Q227339
- schemaLabel: repeated properties
  schema: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    <#S1> {
      :p xsd:integer ;
      :p IRI ;
      :p xsd:decimal ;
      :p @<#S2>
    }

    <#S2> {
      :q [5]
    }
  dataLabel: passing data
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    <#n1>
      :p 1.1 ;
      :p <#n3> ;
      :p <#n2> ;
      :p 4 ;
    .

    <#n3> :q 5 .
  queryMap: |
    <#n1>@<#S1>
  status: conformant

