---
# ShExReduce's demos: the schema recognizes, the actions reduce.
#
# Each entry names the extension it needs, so a plain app page becomes one
# that folds actions over a parse on being asked to open this manifest.
- schemaLabel: calc, actions guide
  schemaURL: calc-semact/guide.shex
  dataLabel: sums
  dataURL: calc-semact/sums.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#Expr>"
  status: conformant
  plugins:
  - ../doc/ShExReducePlugin.js
# ...and the same numbers with a last one that isn't their sum: every number
# is a <#MidNum>, so it still parses -- the AST just ends in an ordinary num
- schemaLabel: calc, actions guide
  schemaURL: calc-semact/guide.shex
  dataLabel: doesn't sum
  dataURL: calc-semact/doesnt-sum.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#Expr>"
  status: conformant
  plugins:
  - ../doc/ShExReducePlugin.js
- schemaLabel: calc, actions falsify
  schemaURL: calc-semact/falsify.shex
  dataLabel: sums
  dataURL: calc-semact/sums.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#CalcExpr>"
  status: conformant
  plugins:
  - ../doc/ShExReducePlugin.js
# where the schema chooses the last number and the action only checks it, a
# wrong sum has nowhere else to go: the match fails
- schemaLabel: calc, actions falsify
  schemaURL: calc-semact/falsify.shex
  dataLabel: doesn't sum
  dataURL: calc-semact/doesnt-sum.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#CalcExpr>"
  status: nonconformant
  plugins:
  - ../doc/ShExReducePlugin.js
- schemaLabel: calc, actions in an overlay
  schemaURL: calc/calc.shex
  dataLabel: (1 + 2) * 3
  dataURL: calc/expr1.ttl
  queryMap: "<http://a.example/expr1#e1>@<http://a.example/calc#Expr>"
  overlayURL: calc/calc-actions.ttl
  status: conformant
  plugins:
  - ../doc/ShExReducePlugin.js
# ...and the same trick on a grammar nobody wrote for the occasion: ShExR is
# the RDF serialization of ShEx, ShExR.shex is the schema for it, and the
# overlay says what each of its productions means in ShExJ.  So the data is
# a schema, the schema is the schema for schemas, and what the fold builds
# is the ShExJ the data says -- a ShExR reader that is a reader ShEx
# generates rather than one anybody hand-wrote (packages/extension-reduce/
# examples/shexr/, and ShExR-test runs it over the whole shexTest corpus).
- schemaLabel: ShExR, read by ShEx
  schemaURL: shexr/ShExR.shex
  dataLabel: an issue schema
  dataURL: shexr/issue-schema.ttl
  overlayURL: shexr/shexr-actions.ttl
  queryMap: "{FOCUS rdf:type sx:Schema}@START"
  status: conformant
  plugins:
  - ../doc/ShExReducePlugin.js
