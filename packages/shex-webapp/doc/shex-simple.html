<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>ShEx — Online Validator</title>
    <link rel="icon" href="ShEx-bones-min.svg" />
    <script>
      // A published URL: this page was the validator for years.  The
      // validator is shex.html now, and whatever this page was asked for
      // goes along as written -- the two pages share a directory, so a
      // relative URL means the same thing there -- hash included.
      location.replace(new URL("shex.html", location.href).href + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>The validator is <a href="shex.html">shex.html</a>.
      If your browser did not follow it, <a href="shex.html">open it there</a>.</p>
  </body>
</html>
