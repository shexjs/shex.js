name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # OIDC trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci --allow-git=all

      # Publish every non-private workspace, in dependency order, skipping any
      # version the registry already has. This is the same tool used locally;
      # each `npm publish` it runs uses this job's OIDC token (trusted publishing).
      # (An explicit -w list risks omitting a package other released packages
      # depend on -- editor-services, neighborhood-wikibase, the extensions and
      # semact-overlay are all depended on by cli/webapp/shex.)
      - run: node tools/publish-ordered.js --tag latest
