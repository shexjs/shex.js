# --- packages/extension-reduce/examples/manifest.yaml
# ShExReduce: the same, for the calculator
# ShExReduce's demos: the schema recognizes, the actions reduce.
#
# Each entry names the extension it needs, so a plain app page becomes one
# that folds actions over a parse on being asked to open this manifest.
- schemaLabel: calc, actions guide
  schemaURL: ../packages/extension-reduce/examples/calc-semact/guide.shex
  dataLabel: sums
  dataURL: ../packages/extension-reduce/examples/calc-semact/sums.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#Expr>"
  status: conformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js
# ...and the same numbers with a last one that isn't their sum: every number
# is a <#MidNum>, so it still parses -- the AST just ends in an ordinary num
- schemaLabel: calc, actions guide
  schemaURL: ../packages/extension-reduce/examples/calc-semact/guide.shex
  dataLabel: doesn't sum
  dataURL: ../packages/extension-reduce/examples/calc-semact/doesnt-sum.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#Expr>"
  status: conformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js
- schemaLabel: calc, actions falsify
  schemaURL: ../packages/extension-reduce/examples/calc-semact/falsify.shex
  dataLabel: sums
  dataURL: ../packages/extension-reduce/examples/calc-semact/sums.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#CalcExpr>"
  status: conformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js
# where the schema chooses the last number and the action only checks it, a
# wrong sum has nowhere else to go: the match fails
- schemaLabel: calc, actions falsify
  schemaURL: ../packages/extension-reduce/examples/calc-semact/falsify.shex
  dataLabel: doesn't sum
  dataURL: ../packages/extension-reduce/examples/calc-semact/doesnt-sum.ttl
  queryMap: "<http://a.example/expr2#e1>@<http://a.example/calc#CalcExpr>"
  status: nonconformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js
- schemaLabel: calc, actions in an overlay
  schemaURL: ../packages/extension-reduce/examples/calc/calc.shex
  dataLabel: (1 + 2) * 3
  dataURL: ../packages/extension-reduce/examples/calc/expr1.ttl
  queryMap: "<http://a.example/expr1#e1>@<http://a.example/calc#Expr>"
  overlayURL: ../packages/extension-reduce/examples/calc/calc-actions.ttl
  status: conformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js
# ...and one the grammar is happy with and the compiler is not: `/ 0` is a
# fact about two of the production's parts at once, which is beyond a
# grammar.  The action cuts rather than rejects -- <#e1> was never going to
# be a <#Num> instead -- so the reader gets that reason rather than the last
# branch's.  (An explicit `/ 0`, mind: `/ (5 - 5)` is a division by zero the
# grammar and the actions both let through, and the AST it builds is one
# for whoever evaluates it to complain about.)
- schemaLabel: calc, actions in an overlay
  schemaURL: ../packages/extension-reduce/examples/calc/calc.shex
  dataLabel: (1 + 2) / 0
  dataURL: ../packages/extension-reduce/examples/calc/divide-by-zero.ttl
  queryMap: "<http://a.example/expr3#e1>@<http://a.example/calc#Expr>"
  overlayURL: ../packages/extension-reduce/examples/calc/calc-actions.ttl
  status: nonconformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js
# ...and the other side of the line that draws.  The action asks whether the
# right operand is the number 0 -- a fact about the production it is
# reducing -- and does not evaluate the expression, which is somebody else's
# job.  So this conforms, and `reduce` builds an AST that divides by zero
# for whoever evaluates it to answer for.
- schemaLabel: calc, actions in an overlay
  schemaURL: ../packages/extension-reduce/examples/calc/calc.shex
  dataLabel: (1 + 2) / (5 - 5)
  dataURL: ../packages/extension-reduce/examples/calc/divide-by-computed-zero.ttl
  queryMap: "<http://a.example/expr4#e1>@<http://a.example/calc#Expr>"
  overlayURL: ../packages/extension-reduce/examples/calc/calc-actions.ttl
  status: conformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js
# ...and the same trick on a grammar nobody wrote for the occasion: ShExR is
# the RDF serialization of ShEx, ShExR.shex is the schema for it, and the
# overlay says what each of its productions means in ShExJ.  So the data is
# a schema, the schema is the schema for schemas, and what the fold builds
# is the ShExJ the data says -- a ShExR reader that is a reader ShEx
# generates rather than one anybody hand-wrote (packages/extension-reduce/
# examples/shexr/, and ShExR-test runs it over the whole shexTest corpus).
- schemaLabel: ShExR, read by ShEx
  schemaURL: ../packages/shex-util/ShExR.shex
  dataLabel: an issue schema
  dataURL: ../packages/extension-reduce/examples/shexr/issue-schema.ttl
  overlayURL: ../packages/extension-reduce/examples/shexr/shexr-actions.ttl
  queryMap: "{FOCUS rdf:type sx:Schema}@START"
  status: conformant
  plugins:
  - ../packages/extension-reduce/doc/ShExReducePlugin.js

# --- packages/extension-eval/examples/manifest.yaml
# the Eval extension: JavaScript semantic actions
# The Eval extension (http://shex.io/extensions/Eval/): JavaScript in a
# schema's semantic actions.  Each entry names the plugin it needs, so
# opening this manifest in a plain app page installs the handler.
- schemaLabel: Eval notes the match
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Eval: <http://shex.io/extensions/Eval/>
    start = @<S>
    <S> { :p . %Eval:{ extensionStorage.object = this.triples[0].object.value; return true; %} }
  dataLabel: one triple
  data: |
    PREFIX : <http://a.example/>
    :x :p "noted" .
  queryMap: |
    <http://a.example/x>@START
  status: conformant
  comment: The action writes what matched into the result's `extensions` -- switch the interface to appinfo to read it.
  plugins:
  - ../packages/extension-eval/doc/ShExEvalPlugin.js
- schemaLabel: Eval refuses a value
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Eval: <http://shex.io/extensions/Eval/>
    start = @<S>
    <S> { :p . %Eval:{ return this.triples[0].object.value !== "999"; %} }
  dataLabel: the refused value
  data: |
    PREFIX : <http://a.example/>
    :x :p "999" .
  queryMap: |
    <http://a.example/x>@START
  status: nonconformant
  comment: An action that answers false fails the constraint it is written on.
  plugins:
  - ../packages/extension-eval/doc/ShExEvalPlugin.js

# --- packages/extension-test/examples/manifest.yaml
# the Test extension: the suite's semantic-action probe
# The Test extension (http://shex.io/extensions/Test/), the suite's probe:
# print(...) records a line on the validator, fail(...) records it and
# fails the constraint it is written on.  Each entry names the plugin it
# needs, so opening this manifest in a plain app page installs the handler.
- schemaLabel: Test prints the object
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Test: <http://shex.io/extensions/Test/>
    start = @<S>
    <S> { :p . %Test:{ print(o) %} }
  dataLabel: one triple
  data: |
    PREFIX : <http://a.example/>
    :x :p "printed" .
  queryMap: |
    <http://a.example/x>@START
  status: conformant
  comment: print(o) records the matched object; the CLI shows the lines as semActResults.
  plugins:
  - ../packages/extension-test/doc/ShExTestPlugin.js
- schemaLabel: Test can fail a match
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Test: <http://shex.io/extensions/Test/>
    start = @<S>
    <S> { :p . %Test:{ fail("unwelcome ", o) %} }
  dataLabel: the failed value
  data: |
    PREFIX : <http://a.example/>
    :x :p "999" .
  queryMap: |
    <http://a.example/x>@START
  status: nonconformant
  comment: fail(...) is a SemActFailure on the constraint, so the pair goes red.
  plugins:
  - ../packages/extension-test/doc/ShExTestPlugin.js

# --- packages/extension-wasi/examples/manifest.yaml
# the WASI extension: WAT semantic actions, compiled in the page
# The generic WASI extension (http://shex.io/extensions/WASI/): a semantic
# action's code is the WAT source of a WASI command, composed with the
# library prelude (lib/prelude.wat: $put_s/$put_p/$put_o/$put_n, $nl,
# $fail...), compiled by wabt and run per invocation.  Each entry names the
# plugin it needs; loading it brings wabt along (~700 KB), which is the
# price of compiling WebAssembly in a page.
- schemaLabel: WASI prints the object
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Wasi: <http://shex.io/extensions/WASI/>
    start = @<S>
    <S> { :p . %Wasi:{ (func $main (call $put_o) (call $nl)) %} }
  dataLabel: one triple
  data: |
    PREFIX : <http://a.example/>
    :x :p "printed by wasm" .
  queryMap: |
    <http://a.example/x>@START
  status: conformant
  comment: The module prints the matched object to WASI fd 1 and exits 0.
  plugins:
  - ../packages/extension-wasi/doc/ShExWasiPlugin.js
- schemaLabel: WASI can fail a match
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Wasi: <http://shex.io/extensions/WASI/>
    start = @<S>
    <S> { :p . %Wasi:{ (func $main (call $put_o) (call $nl) (call $fail)) %} }
  dataLabel: the failed value
  data: |
    PREFIX : <http://a.example/>
    :x :p "999" .
  queryMap: |
    <http://a.example/x>@START
  status: nonconformant
  comment: exit(1) is a SemActFailure on the constraint, so the pair goes red.
  plugins:
  - ../packages/extension-wasi/doc/ShExWasiPlugin.js
# The schema can bring a library of its own: a start action whose fields
# declare no $main runs nothing -- it joins the prelude in every action of
# the schema.  myPrint and myFail here are put_o/nl and fail, said once by
# the schema; the standalone module at the bottom of this ladder writes the
# same two by hand.
- schemaLabel: WASI library in a start action
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Wasi: <http://shex.io/extensions/WASI/>
    %Wasi:{ (func $myPrint (call $put_o) (call $nl))
            (func $myFail (call $fail)) %}
    start = @<S>
    <S> { :p . %Wasi:{ (func $main (call $myPrint)) %} }
  dataLabel: one triple
  data: |
    PREFIX : <http://a.example/>
    :x :p "printed by the schema's library" .
  queryMap: |
    <http://a.example/x>@START
  status: conformant
  comment: The start action declares myPrint and myFail once for the whole schema; the constraint just calls myPrint.
  plugins:
  - ../packages/extension-wasi/doc/ShExWasiPlugin.js
- schemaLabel: WASI library can fail a match
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Wasi: <http://shex.io/extensions/WASI/>
    %Wasi:{ (func $myPrint (call $put_o) (call $nl))
            (func $myFail (call $fail)) %}
    start = @<S>
    <S> { :p . %Wasi:{ (func $main (call $myPrint) (call $myFail)) %} }
  dataLabel: the failed value
  data: |
    PREFIX : <http://a.example/>
    :x :p "999" .
  queryMap: |
    <http://a.example/x>@START
  status: nonconformant
  comment: myFail is the library's spelling of fail -- the object prints, exit(1) goes red, like "WASI can fail a match" one rung up.
  plugins:
  - ../packages/extension-wasi/doc/ShExWasiPlugin.js
# The next tier down: the action brings its own data segment and prints it
# with the prelude's $put(ptr, len) -- the author's segments start at 8192
# (the prelude's memory map).  test/wasi/*.shex holds more of these.
- schemaLabel: WASI writes its own data
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Wasi: <http://shex.io/extensions/WASI/>
    start = @<S>
    <S> { :p . %Wasi:{
          (data (i32.const 8192) "from a data segment")
          (func $main (
              call $put (i32.const 8192)
              (i32.const 19)
            )
            (call $nl)
          )
          %} }
  dataLabel: one triple
  data: |
    PREFIX : <http://a.example/>
    :x :p "ignored here" .
  queryMap: |
    <http://a.example/x>@START
  status: conformant
  comment: The action's own bytes, placed and measured by the author; only the printing is the prelude's.
  plugins:
  - ../packages/extension-wasi/doc/ShExWasiPlugin.js
# ...and all the way down: code beginning with (module ...) is compiled as
# it stands, no prelude -- the action imports WASI itself, loads argv (the
# bindings arrive as "letter=value" entries), finds o=, and prints its value.
- schemaLabel: WASI standalone module
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Wasi: <http://shex.io/extensions/WASI/>
    start = @<S>
    <S> { :p . %Wasi:{ (module
      (import "wasi_snapshot_preview1" "args_sizes_get" (func $args_sizes_get (param i32 i32) (result i32)))
      (import "wasi_snapshot_preview1" "args_get" (func $args_get (param i32 i32) (result i32)))
      (import "wasi_snapshot_preview1" "fd_write" (func $fd_write (param i32 i32 i32 i32) (result i32)))
      (import "wasi_snapshot_preview1" "proc_exit" (func $proc_exit (param i32)))
      (memory (export "memory") 1)
      (func (export "_start")
        (local $argc i32) (local $i i32) (local $p i32) (local $len i32)
        ;; load the registers: argc at 0, byte size at 4, pointers at 48, text at 1024
        (drop (call $args_sizes_get (i32.const 0) (i32.const 4)))
        (drop (call $args_get (i32.const 48) (i32.const 1024)))
        (local.set $argc (i32.load (i32.const 0)))
        (block $done
          (loop $next
            (br_if $done (i32.ge_u (local.get $i) (local.get $argc)))
            (local.set $p (i32.load (i32.add (i32.const 48) (i32.mul (local.get $i) (i32.const 4)))))
            ;; an entry "o=<value>": print the value and exit 0
            (if (i32.and (i32.eq (i32.load8_u (local.get $p)) (i32.const 111))
                         (i32.eq (i32.load8_u (i32.add (local.get $p) (i32.const 1))) (i32.const 61)))
              (then
                (local.set $p (i32.add (local.get $p) (i32.const 2)))
                (block $end
                  (loop $scan
                    (br_if $end (i32.eqz (i32.load8_u (i32.add (local.get $p) (local.get $len)))))
                    (local.set $len (i32.add (local.get $len) (i32.const 1)))
                    (br $scan)))
                (i32.store (i32.const 16) (local.get $p))
                (i32.store (i32.const 20) (local.get $len))
                (drop (call $fd_write (i32.const 1) (i32.const 16) (i32.const 1) (i32.const 32)))
                (call $proc_exit (i32.const 0))))
            (local.set $i (i32.add (local.get $i) (i32.const 1)))
            (br $next)))
        ;; no o binding: invocation error
        (call $proc_exit (i32.const 2)))
    ) %} }
  dataLabel: one triple
  data: |
    PREFIX : <http://a.example/>
    :x :p "printed by a standalone module" .
  queryMap: |
    <http://a.example/x>@START
  status: conformant
  comment: No prelude at all -- the module does its own argv loading, printing and exit.
  plugins:
  - ../packages/extension-wasi/doc/ShExWasiPlugin.js

# --- packages/extension-wasi-test/examples/manifest.yaml
# the Test extension in hand-written WebAssembly
# The Test extension reimplemented in hand-written WebAssembly
# (lib/extension-wasi-test.wat): same URL, same grammar, same protocol as
# @shexjs/extension-test -- these entries are extension-test's pair, run
# through wasm.  Each names the plugin it needs, which fetches the .wasm
# from lib/ beside this package.
- schemaLabel: wasm Test prints the object
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Test: <http://shex.io/extensions/Test/>
    start = @<S>
    <S> { :p . %Test:{ print(o) %} }
  dataLabel: one triple
  data: |
    PREFIX : <http://a.example/>
    :x :p "printed by wasm" .
  queryMap: |
    <http://a.example/x>@START
  status: conformant
  comment: The wasm module parses print(o), assembles the line and prints it through WASI fd_write.
  plugins:
  - ../packages/extension-wasi-test/doc/ShExWasiTestPlugin.js
- schemaLabel: wasm Test can fail a match
  schema: |
    PREFIX : <http://a.example/>
    PREFIX Test: <http://shex.io/extensions/Test/>
    start = @<S>
    <S> { :p . %Test:{ fail("unwelcome ", o) %} }
  dataLabel: the failed value
  data: |
    PREFIX : <http://a.example/>
    :x :p "999" .
  queryMap: |
    <http://a.example/x>@START
  status: nonconformant
  comment: fail(...) comes back as a SemActFailure from the wasm module, so the pair goes red.
  plugins:
  - ../packages/extension-wasi-test/doc/ShExWasiTestPlugin.js
