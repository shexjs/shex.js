  status: nonconformant
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a birthdate that is a dateTime
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1> :subject <Patient2> .
    
    <Patient2> :birthdate "1999-12-31T01:23:45"^^xsd:dateTime .
  queryMap: |
    <Obs1>@START
  status: nonconformant
  comment: 'A date and a dateTime are different datatypes, however alike they read.'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a quantity with no number and no code
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1>
      :subject       <Patient2> ;
      :valueQuantity [
        :unit "kg" ;
        :system <http://unitsofmeasure.org> ;
      ] .
  queryMap: |
    <Obs1>@START
  status: nonconformant
  comment: 'Quantity :value is required and :system is contingent on :code'
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: a gender outside the value set
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    
    <Obs1> :subject <Patient2> .
    
    <Patient2> :gender "M" .
  queryMap: |
    <Obs1>@START
  status: nonconformant
- schemaLabel: clinical observation
  schemaURL: ../packages/shex-webapp/examples/ClinObs.shex
  dataLabel: two documents, and the mistake is in the second
  data:
  - |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    BASE <http://hl7.example/>
    
    # Observation
    <Obs1>
      :status  "final" ;
      :subject <Patient2> .
  - |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    BASE <http://hl7.example/>
    
    # Patient
    <Patient2>
      :name   "Bob" ;
      :gender "M" .
  queryMap: |
    <http://hl7.example/Obs1>@<ObservationShape>
  status: nonconformant
  comment: 'Validating the observation walks into the patient, so a bad gender code in the second document fails the first.  Hovering the failure switches to the document that caused it.'
- schemaLabel: GO-CAM example
  schemaURL: ../packages/shex-webapp/examples/GO-CAM-schema.shex
  dataLabel: 1 instance with parents
  dataURL: ../packages/shex-webapp/examples/GO-CAM-instance.ttl
  queryMap: |
    <http://model.geneontology.org/5b528b1100001416/5b528b1100001522>@<#S1>
  status: conformant
- schemaLabel: wikidata query
  schema: |
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX prov: <http://www.w3.org/ns/prov#>
    PREFIX p: <http://www.wikidata.org/prop/>
    PREFIX pr: <http://www.wikidata.org/prop/reference/>
    PREFIX ps: <http://www.wikidata.org/prop/statement/>

    start = @<wikidata_item>

    <wikidata_item> {
      p:P1748 {
        ps:P1748 LITERAL ;
        prov:wasDerivedFrom @<reference>+
      }+
    }

    <reference> {
      pr:P248  IRI ;
      pr:P813  xsd:dateTime ;
      # pr:P699  LITERAL
    }
  dataLabel: '12078'
  queryMap: |-
    SPARQL '''SELECT ?item ?itemLabel WHERE {
      ?item wdt:P279* wd:Q12078 .
      SERVICE wikibase:label {
        bd:serviceParam wikibase:language "en"
      }
    } LIMIT 10'''@START
  status: conformant
  neighborhood: sparql
  dataBase: http://www.wikidata.org/entity/
  endpoint: https://query.wikidata.org/sparql
- schemaLabel: Wikidata person
  schemaURL: ../packages/shex-webapp/examples/wikidata-person.shex
  dataLabel: Q42 from the query service
  neighborhood: sparql
  dataBase: http://www.wikidata.org/entity/
  endpoint: https://query.wikidata.org/sparql
  queryMap: |
    <http://www.wikidata.org/entity/Q42>@START
  status: conformant
  comment: Douglas Adams, validated by asking query.wikidata.org for each neighborhood as the walk needs it.
- schemaLabel: Wikidata person
  schemaURL: ../packages/shex-webapp/examples/wikidata-person.shex
  dataLabel: Q42, Q76 from the JSON API
  neighborhood: wikibase
  dataBase: http://www.wikidata.org/entity/
  base: https://www.wikidata.org/wiki/Special:EntityData/
  queryMap: |
    QENTITIES "42 76"@START
  status: conformant
  comment: The same entity, and Q76 with it, from the JSON pages Wikidata is edited through, turned back into the RDF the query service would serve.  The QueryMap names entities by id and lets this source work out what they are called.
- schemaLabel: Wikidata person
  schemaURL: ../packages/shex-webapp/examples/wikidata-person.shex
  dataLabel: Q42 from a downloaded page
  neighborhood: wikibase
  dataBase: http://www.wikidata.org/entity/
  dataURL: ../packages/shex-webapp/examples/wikidata-Q42.json
  queryMap: |
    <http://www.wikidata.org/entity/Q42>@START
  status: conformant
  comment: 'The same entity from a page downloaded earlier: edit it in the pane to see what an edit would validate as before making it.  With a downloaded site table too (the sitelinks in a page name wikis like "enwiki", and only that table says which URL and language that is), this entry needs no network at all.'
  sitematrix: ../packages/shex-webapp/examples/wikidata-sitematrix.json
- schemaLabel: Wikidata human gene
  schemaURL: ../packages/shex-webapp/examples/wikidata-human-gene.shex
  dataLabel: BRCA1, its chromosome and its assembly
  neighborhood: wikibase
  dataBase: http://www.wikidata.org/entity/
  base: https://www.wikidata.org/wiki/Special:EntityData/
  queryMap: |
    QENTITIES "227339"@START
  status: conformant
  comment: 'GeneWiki''s human gene schema (EntitySchema:E37), with the two schemas it imports inlined: a gene''s chromosome is E109''s and the genome assembly its coordinates are given against is E108''s.  So validating BRCA1 (Q227339) walks from the gene to chromosome 17 (Q220677) and on to GRCh38 (Q20966585) -- three entities, three shapes, each page fetched as the walk reaches it.  Four constraints are relaxed here, each marked RELAXED IN THIS COPY where it stands: three are places where the data cites a source the schema enumerates without (a newer Ensembl release, the OMA browser), and one is a normalized value this source can''t derive from an entity page.'
- schemaLabel: repeated properties
  schema: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    <#S1> {
      :p xsd:integer ;
      :p IRI ;
      :p xsd:decimal ;
      :p @<#S2>
    }

    <#S2> {
      :q [5]
    }
  dataLabel: passing data
  data: |
    PREFIX : <http://hl7.org/fhir/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    <#n1>
      :p 1.1 ;
      :p <#n3> ;
      :p <#n2> ;
      :p 4 ;
    .

    <#n3> :q 5 .
  queryMap: |
    <#n1>@<#S1>
  status: conformant
- schemaLabel: fixed metadata graph
  schemaURL: ../packages/shex-webapp/examples/dataset-catalog.shex
  dataLabel: validate management graph
  data: |
    PREFIX ex: <http://ex.example/ns#>

    <s1> ex:foo "bar" .

    GRAPH <CardCatalog> {
      <entry1> ex:manages <s1> ;
        ex:source "https://feed.example/s1" ;
        ex:refresh "2026-09-01"^^<http://www.w3.org/2001/XMLSchema#date> .
    }
  queryMap: |
    <s1>@<#S1>
  status: conformant
  comment: 'A dataset with a housekeeping graph: `GRAPH <CardCatalog>` scopes the ^ex:manages arc and the whole catalog entry into it, the way a SPARQL `GRAPH <CardCatalog> { ... }` block would (doc/datasets.md).'
- schemaLabel: fixed metadata graph
  schemaURL: ../packages/shex-webapp/examples/dataset-catalog.shex
  dataLabel: metadata gone astray
  data: |
    PREFIX ex: <http://ex.example/ns#>

    <s1> ex:foo "bar" .
    <entry1> ex:manages <s1> ;
      ex:source "https://feed.example/s1" ;
      ex:refresh "2026-09-01"^^<http://www.w3.org/2001/XMLSchema#date> .
  queryMap: |
    <s1>@<#S1>
  status: nonconformant
  comment: 'The same entry written into the default graph: the constraint speaks only of <CardCatalog>, so the arc is missing where the schema looks.'
- schemaLabel: genes by graph
  schemaURL: ../packages/shex-webapp/examples/dataset-gene.shex
  dataLabel: BRCA1 and its records
  data: |
    PREFIX gene: <http://example.org/gene/>
    PREFIX prov: <http://www.w3.org/ns/prov#>
    PREFIX ex: <http://example.org/>
    PREFIX ucscGb: <http://genome.ucsc.edu/>
    PREFIX genebank: <http://ncbi.nlm.nih.gov/genebank/>
    PREFIX ensembl: <http://www.ensembl.org/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX uniprot: <http://uniprot.org/uniprot/>
    PREFIX uniprotRef: <http://uniprot.org/ref/>

    # BRCA1 - the gene's own facts, in the default graph
    gene:BRCA1
      gene:product gene:BRCA1-encodes-001 , gene:BRCA1-encodes-002 ;
      gene:chromosome gene:BRCA1-chr17 .

    gene:BRCA1-encodes-001
      gene:encodes uniprot:P38398 ;
      prov:wasDerivedFrom uniprotRef:P38398 .

    gene:BRCA1-encodes-002
      gene:encodes uniprot:P38398-2 ;
      prov:wasDerivedFrom uniprotRef:P38398-2 .

    # each chromosome and reference record lives in the graph named for it
    GRAPH gene:BRCA1-chr17 {
      gene:BRCA1-chr17
        gene:assembly [
          ucscGb:id "chr17:43044295-43125483" ;
          ex:publicationDate "2023-06-10T00:00:00Z"^^xsd:dateTime
        ] , [
          genebank:id "NC_000017.11" ;
          ex:publicationDate "2023-04-20T00:00:00Z"^^xsd:dateTime
        ] ;
        prov:wasDerivedFrom [ ensembl:geneId "ENSG00000012048" ] .
    }

    GRAPH uniprotRef:P38398 {
      uniprotRef:P38398 ex:id "P38398" ;
        ex:when "2024-01-15T09:30:00Z"^^xsd:dateTime .
    }

    GRAPH uniprotRef:P38398-2 {
      uniprotRef:P38398-2 ex:id "P38398-2" ;
        ex:when "2023-11-22T14:45:00Z"^^xsd:dateTime .
    }
  queryMap: |
    gene:BRCA1@<#human-gene>
  status: conformant
  comment: '`GRAPH TERM` follows each matched value into the graph of the same name: the chromosome record in GRAPH gene:BRCA1-chr17, each UniProt reference in the graph named for it.  The gene''s own arcs stay in the default graph.'
- schemaLabel: genes by graph
  schemaURL: ../packages/shex-webapp/examples/dataset-gene.shex
  dataLabel: a reference outside its graph
  data: |
    PREFIX gene: <http://example.org/gene/>
    PREFIX prov: <http://www.w3.org/ns/prov#>
    PREFIX ex: <http://example.org/>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
    PREFIX uniprot: <http://uniprot.org/uniprot/>
    PREFIX uniprotRef: <http://uniprot.org/ref/>

    gene:BRCA1
      gene:product gene:BRCA1-encodes-001 .

    gene:BRCA1-encodes-001
      gene:encodes uniprot:P38398 ;
      prov:wasDerivedFrom uniprotRef:P38398 .

    # the reference record strayed into the default graph
    uniprotRef:P38398 ex:id "P38398" ;
      ex:when "2024-01-15T09:30:00Z"^^xsd:dateTime .
  queryMap: |
    gene:BRCA1@<#human-gene>
  status: nonconformant
  comment: 'The reference''s record must live in the graph named after it; written into the default graph it is outside the view `GRAPH TERM` switches to, so ex:id and ex:when are missing there.'
- schemaLabel: WebID profiles
  schemaURL: ../packages/shex-webapp/examples/dataset-profile.shex
  dataLabel: two cards, mutual friends
  data: |
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>

    GRAPH <https://alice.example/card> {
      <https://alice.example/card> a foaf:PersonalProfileDocument ;
        foaf:primaryTopic <https://alice.example/card#me> .

      <https://alice.example/card#me> a foaf:Person ;
        foaf:name "Alice" ;
        foaf:knows <https://bob.example/card#me> .
    }

    GRAPH <https://bob.example/card> {
      <https://bob.example/card> a foaf:PersonalProfileDocument ;
        foaf:primaryTopic <https://bob.example/card#me> .

      <https://bob.example/card#me> a foaf:Person ;
        foaf:name "Bob" ;
        foaf:knows <https://alice.example/card#me> .
    }
  queryMap: |
    <https://alice.example/card>@<#ProfileDoc>
  status: conformant
  comment: 'Each profile document is a graph; `GRAPH FRAGMENT` follows <https://bob.example/card#me> into <https://bob.example/card>.  Alice and Bob know each other, and the cycle terminates the way recursive shapes always have.'
- schemaLabel: WebID profiles
  schemaURL: ../packages/shex-webapp/examples/dataset-profile.shex
  dataLabel: an acquaintance with no card
  data: |
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>

    GRAPH <https://bob.example/card> {
      <https://bob.example/card> a foaf:PersonalProfileDocument ;
        foaf:primaryTopic <https://bob.example/card#me> .

      <https://bob.example/card#me> a foaf:Person ;
        foaf:name "Bob" ;
        foaf:knows <https://carol.example/card#me> .
    }
  queryMap: |
    <https://bob.example/card>@<#ProfileDoc>
  status: nonconformant
  comment: 'Bob claims to know Carol, but no graph <https://carol.example/card> describes her: the foaf:knows arc matches the constraint''s predicate and its value fails in the graph the schema says to look in.'
- schemaLabel: triple terms
  schemaURL: ../packages/shex-webapp/examples/triple-terms.shex
  dataLabel: an assertion, with provenance
  data: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>
    PREFIX ex: <http://ex.example/ns#>

    <tim> a foaf:Person ; foaf:name "Tim Berners-Lee" .
    <henry> a foaf:Person ; foaf:name "Henry Story" .
    <alice> a foaf:Person ; foaf:name "Alice" .

    <a1> rdf:reifies << <tim> foaf:knows <henry> >> ;
      ex:assertedBy <alice> ;
      ex:confidence 0.95 .
  queryMap: |
    <a1>@<#Assertion>
  status: conformant
  comment: 'The reifier model: <a1> is an ordinary node whose rdf:reifies value is a triple term.  The <<( @<#Person> foaf:knows @<#Person> )>> atom checks the term positionally, and its components against their *asserted* descriptions -- quotation itself asserts nothing.'
- schemaLabel: triple terms
  schemaURL: ../packages/shex-webapp/examples/triple-terms.shex
  dataLabel: a dispute, by reference
  data: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>
    PREFIX ex: <http://ex.example/ns#>
    PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

    <tim> a foaf:Person ; foaf:name "Tim Berners-Lee" .
    <henry> a foaf:Person ; foaf:name "Henry Story" .
    <alice> a foaf:Person ; foaf:name "Alice" .
    <bob> a foaf:Person ; foaf:name "Bob" .

    <a1> rdf:reifies << <tim> foaf:knows <henry> >> ;
      ex:assertedBy <alice> .

    <d1> ex:disputes <a1> ;
      ex:isDisputedBy <bob> ;
      ex:disputeReason "They have not been in contact for several years" ;
      ex:disputedOn "2024-01-16"^^xsd:date .
  queryMap: |
    <d1>@<#Dispute>
  status: conformant
  comment: 'Bob disputes Alice''s assertion -- and because the assertion is a reifier node, the dispute is a plain reference.  Nesting quotations to talk about talk is the pre-reifier habit; the model flattens it away.'
- schemaLabel: triple terms
  schemaURL: ../packages/shex-webapp/examples/triple-terms.shex
  dataLabel: a weighted edge
  data: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>
    PREFIX ex: <http://ex.example/ns#>

    <e1> rdf:reifies << <a> foaf:knows <b> >> ;
      ex:weight 0.9 .
  queryMap: |
    <e1>@<#WeightedEdge>
  status: conformant
  comment: 'The property-graph case: an edge''s weight lives on its reifier.  The interesting move is <<( ... )>> AND { ^rdf:reifies ... } -- a triple term is a term, so it can be a shape''s focus, and its reifiers are one inverse arc away.'
- schemaLabel: triple terms
  schemaURL: ../packages/shex-webapp/examples/triple-terms.shex
  dataLabel: a mention of strangers
  data: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>

    <m1> rdf:reifies << <nobody> foaf:knows <noone> >> .
  queryMap: |
    <m1>@<#Mention>
  status: conformant
  comment: 'The opacity dial''s other end: <#Mention> constrains the term with <<( IRI foaf:knows IRI )>> -- pure syntax, components unexamined -- so quoting strangers is fine.  Compare "asserting about strangers".'
- schemaLabel: triple terms
  schemaURL: ../packages/shex-webapp/examples/triple-terms.shex
  dataLabel: asserting about strangers
  data: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>
    PREFIX ex: <http://ex.example/ns#>

    <alice> a foaf:Person ; foaf:name "Alice" .

    <a1> rdf:reifies << <nobody> foaf:knows <noone> >> ;
      ex:assertedBy <alice> .
  queryMap: |
    <a1>@<#Assertion>
  status: nonconformant
  comment: '<#Assertion> opted into the connection: its components say @<#Person>, and <nobody> has no asserted description to satisfy it.  The schema author chooses, per component, whether quotation reaches out to asserted data.'
- schemaLabel: triple terms
  schemaURL: ../packages/shex-webapp/examples/triple-terms.shex
  dataLabel: an edge without its weight
  data: |
    PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
    PREFIX foaf: <http://xmlns.com/foaf/0.1/>

    <e1> rdf:reifies << <a> foaf:knows <b> >> .
  queryMap: |
    <e1>@<#WeightedEdge>
  status: nonconformant
  comment: 'The term''s own ^rdf:reifies neighborhood must include a weighted reifier, and this one isn''t.  (What no node-focused shape can say: "every *asserted* foaf:knows arc is annotated" -- nothing connects an asserted triple to the term quoting it.  That gap argues for an arc-level construct, not a different term model; see doc/triple-terms.md.)'

# --- packages/extension-map/examples/manifest.yaml
