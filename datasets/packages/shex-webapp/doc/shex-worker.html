<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <title>ShEx — Online Validator With Workers</title>
    <link rel="icon" href="ShEx-bones-min.svg" />
    <script>
      // A published URL.  The worker app is shex-simple.html?worker=1 now:
      // one page, and the query string says where it validates.  Whatever
      // this page was asked for goes along, as written -- the two pages
      // share a directory, so a relative URL means the same thing there.
      const parms = new URLSearchParams(location.search);
      parms.set("worker", "1");
      location.replace(new URL("shex-simple.html", location.href).href + "?" + parms);
    </script>
  </head>
  <body>
    <p>The worker validator is <a href="shex-simple.html?worker=1">shex-simple.html?worker=1</a>.
      If your browser did not follow it, <a href="shex-simple.html?worker=1">open it there</a>.</p>
  </body>
</html>
