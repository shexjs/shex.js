name: Dependabot auto-merge

# Enable auto-merge on Dependabot PRs that aren't semver-major, so the weekly
# grouped dev/prod PRs land by themselves once CI is green. Major bumps are left
# for a human -- they arrive as their own PR and this workflow skips them.
#
# One-time repo setup this relies on:
#   * Settings ▸ General ▸ "Allow auto-merge" enabled, and
#   * a branch-protection rule on `main` requiring the CI checks,
# so `--auto` waits for those checks and merges only when they pass. Without the
# protection rule there's nothing to gate on and the PR would merge immediately.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Everything except a semver-major (grouped minor/patch PRs report the
      # group's highest bump here, and majors are ungrouped by dependabot.yml).
      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
