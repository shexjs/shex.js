name: webapps-site

# Build the doc/webpacks bundles (gitignored on main; jquery-components.* and
# its hashed assets stay committed — see .gitignore) and publish a complete
# static site of the webapps to the orphan `gh-pages` branch:
#
#   index.html                        <- doc/webapps-index.html
#   packages/shex-webapp/doc/**       (incl. built webpacks/)
#   packages/shex-webapp/examples/**
#   packages/extension-map/doc/**     (incl. built webpacks/)
#   packages/extension-map/examples/**
#
# The repo-relative layout is preserved because the pages reference each other
# relatively (e.g. shexmap-simple.html loads
# ../../shex-webapp/doc/webpacks/shex-webapp.js).
#
# Two consumers:
#  - GitHub Pages: set Pages source to "Deploy from a branch", gh-pages /root
#    (one-time repo setting); the apps then serve at
#    https://shexspec.github.io/shex.js/ .
#  - shex.io: tools/sync-webpacks.sh copies the branch's doc/webpacks trees
#    into a plain clone's working tree.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - name: clone shexTest alongside the checkout, on the ref the shex-test dependency names
        run: |
          REF=$(sed -n 's|.*"shex-test": "github:shexSpec/shexTest#\([^"]*\)".*|\1|p' package.json)
          git clone --depth=1 --branch="${REF:-main}" https://github.com/shexSpec/shexTest.git ../shexTest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run webpacks-all
      - name: publish site to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp doc/webapps-index.html index.html
          touch .nojekyll
          git checkout --orphan gh-pages-build
          git rm -rfq --cached .
          git add -f index.html .nojekyll \
            packages/shex-webapp/doc packages/shex-webapp/examples \
            packages/extension-map/doc packages/extension-map/examples
          git commit -q -m "webapps site built from $GITHUB_SHA"
          git push -f origin HEAD:gh-pages
