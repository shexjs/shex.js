# --- Plugin coordinates -----------------------------------------------------
pluginGroup = org.shexjs.jetbrains
pluginName = shex-jetbrains
pluginVersion = 0.1.0

# Build 242 == IntelliJ 2024.2, the compatibility floor -- the plugin still
# targets 2024.2+. untilBuild covers the platform we build against below (262 ==
# 2026.2); bump both together for a newer IDE.
pluginSinceBuild = 242
pluginUntilBuild = 262.*

# --- Target IDE to compile / run against ------------------------------------
# IntelliJ IDEA, a single distribution since 2025.3 (no more IC/IU split; the
# build.gradle.kts uses intellijIdea(version)). A current build so `runIde`'s
# bundled Gradle plugin can parse modern JDKs -- 2024.2.5's JavaVersion threw on
# Java 25 (GradleJvmSupportMatrix). Bump platformVersion and pluginUntilBuild
# together for a newer IDE.
platformVersion = 2026.2.2

# --- Red Hat LSP4IJ ---------------------------------------------------------
# The LSP client runtime this plugin extends. The Marketplace maven repo hosts
# the recent line (0.19.x–0.21.x as of late 2025; older tags like 0.8.0 are
# pruned and won't resolve). All are `since 242.0`, matching platformVersion.
# The declarative extension points, StreamConnectionProvider, and
# LanguageServerManager/LanguageServerItem APIs used here are current for 0.21.
# Check https://plugins.jetbrains.com/plugin/23257-lsp4ij for the latest.
lsp4ijVersion = 0.21.0

# --- Gradle ergonomics ------------------------------------------------------
org.gradle.jvmargs = -Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
org.gradle.caching = true
# Off by default: the IntelliJ Platform Gradle Plugin's runIde has rough edges
# with the configuration cache (it tries to serialize resolved-plugin state).
# Turn it back on once you have a green build if you want the speedup.
org.gradle.configuration-cache = false

# Do not bundle the Kotlin stdlib: the IntelliJ Platform already ships it.
kotlin.stdlib.default.dependency = false
